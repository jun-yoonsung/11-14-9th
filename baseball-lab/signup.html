<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1a38" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="야구 분석 랩" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>회원가입 | 야구 분석 랩</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main><div class="wrap">
    <div class="card-center">
      <h1>회원가입 <span class="pill blue">다음 버전</span></h1>
      <p class="sub">지금은 체험 로그인으로 모든 기능을 써 볼 수 있어요.</p>
      <form class="form-col" id="signupForm" novalidate>
        <div><label class="label" for="email">이메일</label><input class="field" id="email" type="email" placeholder="name@example.com" autocomplete="off" /></div>
        <div><label class="label" for="nick">닉네임</label><input class="field" id="nick" type="text" placeholder="2~12자" autocomplete="off" /></div>
        <div><label class="label" for="pw">비밀번호</label><input class="field" id="pw" type="password" placeholder="8자 이상" autocomplete="off" /></div>
        <button class="btn pri" type="submit" style="width:100%">회원가입</button>
      </form>
      <div class="notice hidden" id="notice" role="status">회원가입은 다음 버전에서 제공됩니다. 지금은 체험 로그인으로 시작해 주세요.</div>
      <a class="btn" href="login.html">체험 로그인으로 시작</a>
    </div>
  </div></main>
  <footer class="foot" id="siteFoot"></footer>
  <script src="js/core.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/view.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
