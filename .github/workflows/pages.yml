# main에 push하면 baseball-lab(React)을 빌드해 GitHub Pages에 올립니다.
# 사이트 주소는 그대로 https://<계정>.github.io/<저장소>/baseball-lab/ 입니다. 저장소 루트의 다른 파일(ex.html 등)도 같이 올라갑니다.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: baseball-lab/package-lock.json
      - name: Build baseball-lab
        working-directory: baseball-lab
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='baseball-lab' ./ _site/
          cp -r baseball-lab/dist _site/baseball-lab
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
